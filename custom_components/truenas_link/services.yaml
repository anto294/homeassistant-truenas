---
cloudsync_run:
  name: Cloudsync Run
  description: Start a Clousync Job
  target:
    entity:
      integration: truenas_link
      domain: sensor

cloudsync_abort:
  name: Cloudsync Abort
  description: Abort a Clousync Job
  target:
    entity:
      integration: truenas_link
      domain: sensor

pool_scrub_start:
  name: Pool Scrub Start
  description: Start a scrub, or resume a paused one (Target Pool Scan Sensor)
  target:
    entity:
      integration: truenas_link
      domain: sensor

pool_scrub_pause:
  name: Pool Scrub Pause
  description: Pause a running scrub (Target Pool Scan Sensor)
  target:
    entity:
      integration: truenas_link
      domain: sensor

pool_scrub_stop:
  name: Pool Scrub Stop
  description: Stop a running or paused scrub (Target Pool Scan Sensor)
  target:
    entity:
      integration: truenas_link
      domain: sensor

dataset_snapshot:
  name: Dataset Snapshot
  description: Create a Dataset Snapshot
  target:
    entity:
      integration: truenas_link
      domain: sensor

system_reboot:
  name: Reboot TrueNAS
  description: Reboot TrueNAS System (Target Uptime Sensor)
  target:
    entity:
      integration: truenas_link
      domain: sensor

system_shutdown:
  name: Shutdown TrueNAS
  description: Shutdown TrueNAS System (Target Uptime Sensor)
  target:
    entity:
      integration: truenas_link
      domain: sensor

service_start:
  name: Service Start
  description: Start a Service
  target:
    entity:
      integration: truenas_link
      domain: binary_sensor

service_stop:
  name: Service Stop
  description: Stop a Service
  target:
    entity:
      integration: truenas_link
      domain: binary_sensor

service_restart:
  name: Service Restart
  description: Restart a Service
  target:
    entity:
      integration: truenas_link
      domain: binary_sensor

service_reload:
  name: Service Reload
  description: Reload a Service
  target:
    entity:
      integration: truenas_link
      domain: binary_sensor

vm_start:
  name: VM Start
  description: Start a VM
  fields:
    overcommit:
      name: Overcommit Memory
      description: Memory overcommitment allows the VM to launch even though there is insufficient free memory.
      required: false
      default: false
      selector:
        boolean:

  target:
    entity:
      integration: truenas_link
      domain: binary_sensor

vm_stop:
  name: VM Stop
  description: Stop a VM
  target:
    entity:
      integration: truenas_link
      domain: binary_sensor

container_start:
  name: Container Start
  description: Start a container (TrueNAS 27.0 and later)
  target:
    entity:
      integration: truenas_link
      domain: binary_sensor

container_stop:
  name: Container Stop
  description: Stop a container (TrueNAS 27.0 and later)
  target:
    entity:
      integration: truenas_link
      domain: binary_sensor

app_start:
  name: App Start
  description: Start a app
  target:
    entity:
      integration: truenas_link
      domain: binary_sensor

app_stop:
  name: App Stop
  description: Stop a app
  target:
    entity:
      integration: truenas_link
      domain: binary_sensor
