name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (black, flake8, JSON)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install linters
        run: python -m pip install --upgrade black flake8

      - name: Check formatting with black
        run: black . --check --diff

      - name: Check for syntax errors and undefined names with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Report style issues with flake8 (non-blocking)
        run: flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Validate JSON files
        run: |
          for f in hacs.json custom_components/truenas/*.json custom_components/truenas/translations/*.json; do
            python -m json.tool "$f" > /dev/null || { echo "::error file=$f::Invalid JSON"; exit 1; }
          done

  security:
    name: Security (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install bandit
        run: python -m pip install --upgrade bandit

      - name: Scan integration with bandit
        run: bandit -r custom_components/truenas

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  import:
    # Import every module against the oldest supported Home Assistant (the
    # "homeassistant" value in hacs.json) and the latest release, so using an
    # API that is newer than the declared minimum fails CI.
    name: Import (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2024.11.0"
            python: "3.12"
            # Old cores leave some transitive dependencies unpinned; josepy
            # 2.x removed ComparableX509, which the acme release used by
            # hass-nabucasa 0.83 still imports.
            extra: "josepy<2"
          - homeassistant: "latest"
            python: "3.14"
            extra: ""
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Home Assistant and integration requirements
        run: |
          python -m pip install --upgrade pip
          HA_VERSION="${{ matrix.homeassistant }}"
          if [ "$HA_VERSION" = "latest" ]; then
            HA_VERSION=$(curl -sSfL https://pypi.org/pypi/homeassistant/json | python -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')
          fi
          echo "Installing Home Assistant $HA_VERSION"
          # Use the core's own constraints, as Home Assistant does when it
          # installs a custom integration's requirements.
          curl -sSfL -o "$RUNNER_TEMP/constraints.txt" \
            "https://raw.githubusercontent.com/home-assistant/core/$HA_VERSION/homeassistant/package_constraints.txt"
          mapfile -t REQUIREMENTS < <(python -c 'import json; print("\n".join(json.load(open("custom_components/truenas/manifest.json"))["requirements"]))')
          EXTRA="${{ matrix.extra }}"
          pip install "homeassistant==$HA_VERSION" "${REQUIREMENTS[@]}" ${EXTRA:+"$EXTRA"} -c "$RUNNER_TEMP/constraints.txt"

      - name: Import all integration modules
        run: |
          python - <<'EOF'
          import importlib
          import pathlib

          for path in sorted(pathlib.Path("custom_components/truenas").glob("*.py")):
              module = "custom_components.truenas" if path.stem == "__init__" else f"custom_components.truenas.{path.stem}"
              importlib.import_module(module)
              print(f"imported {module}")
          EOF
